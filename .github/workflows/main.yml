name: PaddleGuru California races

on:
  schedule:
    - cron: "17 18 * * 1"   # Mondays ~11:17am PDT / 10:17am PST, after the weekly Claude race task
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape PaddleGuru
        run: python paddleguru_ca.py

      - name: Update Google Sheet and Calendar
        id: sync
        continue-on-error: true
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          set -o pipefail
          python sync_google.py 2>&1 | tee docs/sync_summary.txt

      - name: Upload debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddleguru-debug
          path: debug/
          retention-days: 14

      - name: Commit updated race list
        run: |
          git config user.name "paddlecalpal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update California OC/surfski races from PaddleGuru"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Flag sync problems
        if: steps.sync.outcome == 'failure'
        run: |
          echo "Google Sheet/Calendar sync failed — see docs/sync_summary.txt"
          exit 1
