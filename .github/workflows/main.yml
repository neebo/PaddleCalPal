name: PaddleGuru California races

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays ~6:17am Pacific
  workflow_dispatch: {}      # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape PaddleGuru
        run: python paddleguru_ca.py

      - name: Upload debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddleguru-debug
          path: debug/
          retention-days: 14

      - name: Commit updated race list
        run: |
          git config user.name "paddlecalpal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update California OC/surfski races from PaddleGuru"
            git push
          fi
